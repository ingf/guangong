<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>关圣帝君</title>
<style>
:root { --gold: #e2b45a; --gold-dim: rgba(226,180,90,.55); --ink: #070403;
  --serif: "STKaiti","KaiTi","Kaiti SC","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif; }
html, body { height: 100%; margin: 0; background: var(--ink); overflow: hidden; overscroll-behavior: none; }
body { color: var(--gold); font-family: var(--serif); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; }
#c { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.hud { position: absolute; pointer-events: none; text-shadow: 0 1px 6px rgba(0,0,0,.9); transition: opacity .6s; }
#title { top: calc(14px + env(safe-area-inset-top, 0px)); left: 0; right: 0; text-align: center; font-size: 22px; letter-spacing: .5em; text-indent: .5em; opacity: .9; }
#snd { top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); pointer-events: auto; width: 40px; height: 40px;
  border-radius: 50%; border: 1px solid var(--gold-dim); background: rgba(10,6,4,.45); color: var(--gold); font: 15px var(--serif); cursor: pointer; }
#snd.off { opacity: .45; text-decoration: line-through; }
#bar { left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; gap: 34px; }
#bar button { pointer-events: auto; width: 76px; height: 76px; border-radius: 50%; border: 1px solid var(--gold); cursor: pointer;
  background: radial-gradient(circle at 50% 35%, rgba(120,28,14,.85), rgba(40,8,4,.85)); color: #f3d38a; font: 20px var(--serif); letter-spacing: .1em;
  box-shadow: 0 0 0 3px rgba(226,180,90,.14), 0 6px 18px rgba(0,0,0,.6); transition: transform .12s, filter .2s; }
#bar button:active { transform: scale(.94); }
#bar button:disabled { filter: saturate(.4) brightness(.7); }
#stat { left: 0; right: 0; bottom: calc(6px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 12px; opacity: .55; letter-spacing: .2em; }
#toast { left: 0; right: 0; top: 30%; text-align: center; font-size: 44px; letter-spacing: .4em; text-indent: .4em; opacity: 0; transition: opacity .5s; }
#toast.on { opacity: 1; }
#hint { left: 0; right: 0; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 13px; opacity: .6; letter-spacing: .15em; }
#load { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--ink); transition: opacity 1.2s; z-index: 5; }
#load.done { opacity: 0; pointer-events: none; }
#load b { font-size: 34px; letter-spacing: .5em; text-indent: .5em; font-weight: normal; }
#load i { font-style: normal; font-size: 13px; opacity: .6; letter-spacing: .3em; }
#load u { display: block; width: 180px; height: 1px; background: rgba(226,180,90,.2); text-decoration: none; }
#load u s { display: block; height: 100%; width: 0; background: var(--gold); transition: width .2s; }
body.noui .hud { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" tabindex="0"></canvas>
  <div id="title" class="hud">關聖帝君</div>
  <button id="snd" class="hud" aria-label="声音">音</button>
  <div id="toast" class="hud"></div>
  <div id="hint" class="hud">拖动环视 · 双指或滚轮远近</div>
  <div id="bar" class="hud"><button id="btnIncense">上香</button><button id="btnBow">敬拜</button></div>
  <div id="stat" class="hud"></div>
  <div id="load"><b>關聖帝君</b><u><s id="prog"></s></u><i id="loadTxt">塑像中</i></div>
</div>
