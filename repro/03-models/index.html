{let drag=0,lx=0,ly=0,pts=new Map(),pd0=0;const el=canvas;el.addEventListener('contextmenu',e=>e.preventDefault());

  const up=e=>{pts.delete(e.pointerId);if(!pts.size)drag=0};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
