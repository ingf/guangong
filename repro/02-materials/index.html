<style>

    font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun","PingFang SC","Noto Sans CJK SC",serif;}

  canvas#c:active{cursor:grabbing}
  #title{position:fixed;left:28px;top:22px;pointer-events:none;text-shadow:0 1px 8px #000}
  #title h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.35em;color:#e8c777}
  #title p{margin:6px 0 0;font-size:12px;letter-spacing:.2em;color:#a8946a}
  #nav{position:fixed;left:24px;bottom:24px;display:flex;flex-direction:column;gap:2px;user-select:none}
  #nav button{all:unset;cursor:pointer;font-size:14px;letter-spacing:.18em;padding:6px 14px 6px 10px;color:#b9a67c;
    border-left:2px solid rgba(232,199,119,.18);transition:all .25s;text-shadow:0 1px 6px #000}
  #nav button i{font-style:normal;font-size:11px;color:#7d6c48;margin-right:10px;font-family:Georgia,serif}
  #nav button:hover{color:#f3e2b4;border-left-color:rgba(232,199,119,.6)}
  #nav button.on{color:#ffe9ae;border-left-color:#e8c777;background:linear-gradient(90deg,rgba(120,70,20,.35),transparent)}

    text-shadow:0 1px 10px #000,0 0 2px #000;transition:opacity .6s;max-width:34vw}
  #cap b{display:block;font-size:20px;letter-spacing:.4em;color:#f0d591;font-weight:600}
  #cap span{display:block;margin-top:8px;font-size:12.5px;letter-spacing:.12em;color:#c6b58d;line-height:1.7}
  #hint{position:fixed;right:24px;bottom:24px;font-size:12px;letter-spacing:.12em;color:#8f7d58;text-align:right;line-height:1.9;text-shadow:0 1px 6px #000}
  #hint a{color:#d8bf80;cursor:pointer;border-bottom:1px solid rgba(216,191,128,.4)}

  #load b{font-size:30px;letter-spacing:.6em;color:#d9b866;font-weight:600;padding-left:.6em}

  @media (max-width:760px){#hint{display:none}#cap{max-width:90vw;right:auto;left:28px;text-align:left;top:84px}#nav button{font-size:12px;padding:4px 10px 4px 8px}}
</style>

<body>
<canvas id="c"></canvas>
<div id="title"><h1>關帝廟 · 大殿</h1><p>程序化材質七品 · 無一張外部貼圖</p></div>
<div id="nav"></div>
<div id="cap"><b></b><span></span></div>
<div id="hint">拖動旋轉 · 滾輪縮放 · 數字鍵 0–7<br><a id="auto">自動慢轉：開</a></div>
<div id="load"><b>義薄雲天</b><div id="bar"><i></i></div><span id="lt">正在燒製貼圖…</span></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ============================================================
   0. 基础工具：随机、噪声、场运算、烘焙
   ============================================================ */
const TAU = Math.PI * 2;
const sm = (a, b, x) => { x = (x - a) / (b - a); x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); };
const cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
const lerp = (a, b, t) => a + (b - a) * t;
function mixc(o, c, t) { o[0] += (c[0] - o[0]) * t; o[1] += (c[1] - o[1]) * t; o[2] += (c[2] - o[2]) * t; }
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y, s) { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 362437) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
function vnoise(x, y, per, seed) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const x0 = ((xi % per) + per) % per, x1 = (x0 + 1) % per, y0 = ((yi % per) + per) % per, y1 = (y0 + 1) % per;
  const a = hash2(x0, y0, seed), b = hash2(x1, y0, seed), c = hash2(x0, y1, seed), d = hash2(x1, y1, seed);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const NF = 512;
function fbmField(seed, per, oct, gain = 0.5) {
  const F = new Float32Array(NF * NF); let mn = 9, mx = -9;
  for (let y = 0; y < NF; y++) for (let x = 0; x < NF; x++) {
    let a = 1, s = 0, p = per, fx = x / NF * per, fy = y / NF * per;
    for (let o = 0; o < oct; o++) { s += a * vnoise(fx, fy, p, seed + o * 17); a *= gain; fx *= 2; fy *= 2; p *= 2; }
    F[y * NF + x] = s; if (s < mn) mn = s; if (s > mx) mx = s;
  }
  const k = 1 / (mx - mn); for (let i = 0; i < F.length; i++) F[i] = (F[i] - mn) * k; return F;
}
function S(F, u, v) {
  u -= Math.floor(u); v -= Math.floor(v); if (u >= 1) u = 0; if (v >= 1) v = 0; const x = u * NF, y = v * NF, x0 = (x | 0) & 511, y0 = (y | 0) & 511, x1 = (x0 + 1) & 511, y1 = (y0 + 1) & 511, fx = x - x0, fy = y - y0;
  const a = F[y0 * NF + x0], b = F[y0 * NF + x1], c = F[y1 * NF + x0], d = F[y1 * NF + x1];
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}
const WR = [0, 0, 0];
function worley(x, y, px, py, seed) {
  const xi = Math.floor(x), yi = Math.floor(y); let f1 = 9, f2 = 9, id = 0;
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const cx = xi + i, cy = yi + j, wx = ((cx % px) + px) % px, wy = ((cy % py) + py) % py;
    const dx = cx + hash2(wx, wy, seed) - x, dy = cy + hash2(wx, wy, seed + 7) - y, d = dx * dx + dy * dy;
    if (d < f1) { f2 = f1; f1 = d; id = hash2(wx, wy, seed + 13); } else if (d < f2) f2 = d;
  }
  WR[0] = Math.sqrt(f1); WR[1] = Math.sqrt(f2); WR[2] = id;
}
function blur(F, w, h, r, it = 2) {
  let A = F; const T = new Float32Array(w * h), n = 2 * r + 1;
  for (let k = 0; k < it; k++) {
    const B = new Float32Array(w * h);
    for (let y = 0; y < h; y++) { let s = 0; const o = y * w; for (let x = -r; x <= r; x++) s += A[o + ((x + w) % w)]; for (let x = 0; x < w; x++) { T[o + x] = s / n; s += A[o + ((x + r + 1) % w)] - A[o + ((x - r + w) % w)]; } }
    for (let x = 0; x < w; x++) { let s = 0; for (let y = -r; y <= r; y++) s += T[((y + h) % h) * w + x]; for (let y = 0; y < h; y++) { B[y * w + x] = s / n; s += T[((y + r + 1) % h) * w + x] - T[((y - r + h) % h) * w + x]; } }
    A = B;
  }
  return A;
}
function mkCanvas(w, h, bg = '#000') { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d', { willReadFrequently: true }); if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); } return [c, g]; }
function lum(cv, ch = 0) { const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data, F = new Float32Array(cv.width * cv.height); for (let i = 0; i < F.length; i++) F[i] = d[i * 4 + ch] / 255; return F; }
let MAXA = 8;
function tex(data, w, h, srgb) {
  const [c, g] = mkCanvas(w, h, null); g.putImageData(new ImageData(data, w, h), 0, 0);
  return ctex(c, srgb);
}
function ctex(c, srgb) { const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = MAXA; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; }
/* 烘焙：shade 写 o[0..2]=sRGB 颜色, o[3]=AO, o[4]=粗糙度, o[5]=金属度；高度场 H → 法线 */
function bake(w, h, H, ns, shade) {
  const col = new Uint8ClampedArray(w * h * 4), orm = new Uint8ClampedArray(w * h * 4), nrm = new Uint8ClampedArray(w * h * 4), o = new Float32Array(6);
  for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i++) {
    o[3] = 1; o[4] = .5; o[5] = 0; shade(i, x, y, o);
    const k = i * 4; col[k] = o[0] * 255; col[k + 1] = o[1] * 255; col[k + 2] = o[2] * 255; col[k + 3] = 255;
    orm[k] = o[3] * 255; orm[k + 1] = o[4] * 255; orm[k + 2] = o[5] * 255; orm[k + 3] = 255;
    const xl = x ? x - 1 : w - 1, xr = x < w - 1 ? x + 1 : 0, yu = y ? y - 1 : h - 1, yd = y < h - 1 ? y + 1 : 0;
    const dx = (H[y * w + xr] - H[y * w + xl]) * ns, dy = (H[yd * w + x] - H[yu * w + x]) * ns, il = 1 / Math.sqrt(dx * dx + dy * dy + 1);
    nrm[k] = (-dx * il * .5 + .5) * 255; nrm[k + 1] = (dy * il * .5 + .5) * 255; nrm[k + 2] = (il * .5 + .5) * 255; nrm[k + 3] = 255;
  }
  return { map: tex(col, w, h, true), normalMap: tex(nrm, w, h), orm: tex(orm, w, h) };
}
function pbr(m, p = {}) { return new THREE.MeshPhysicalMaterial({ map: m.map, normalMap: m.normalMap, roughnessMap: m.orm, metalnessMap: m.orm, aoMap: m.orm, roughness: 1, metalness: 1, ...p }); }
function rep(m, rx, ry) { const o = {}; for (const k in m) { o[k] = m[k].clone(); o[k].repeat.set(rx, ry); o[k].needsUpdate = true; } return o; }

let N1, N2, N3, N4;

/* ============================================================
   1. 纹样绘制（白色蒙版，画在黑底 canvas 上）
   ============================================================ */
function curl(g, x, y, r, rot, dir, lw) {
  g.lineWidth = lw; g.beginPath();
  for (let i = 0; i <= 40; i++) { const t = i / 40, a = rot + dir * t * TAU * 1.4, rr = r * (1 - .82 * t); const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; i ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.stroke();
  g.beginPath(); g.moveTo(x + Math.cos(rot) * r, y + Math.sin(rot) * r);
  g.quadraticCurveTo(x + Math.cos(rot - dir * .6) * r * 1.5, y + Math.sin(rot - dir * .6) * r * 1.5, x + Math.cos(rot - dir * 1.3) * r * 1.9, y + Math.sin(rot - dir * 1.3) * r * 1.9); g.stroke();
}
function meander(g, x, y, w, hgt, lw) { // 回纹带
  const n = Math.max(1, Math.round(w / (hgt * 1.25))), cw = w / n; g.lineWidth = lw; g.lineJoin = 'miter'; g.lineCap = 'butt';
  const P = [[0, 1], [0, .08], [.86, .08], [.86, .78], [.3, .78], [.3, .42], [.6, .42]];
  for (let k = 0; k < n; k++) { g.beginPath(); P.forEach((p, i) => { const px = x + (k + p[0]) * cw, py = y + p[1] * hgt; i ? g.lineTo(px, py) : g.moveTo(px, py); }); g.stroke(); }
  g.beginPath(); g.moveTo(x, y + hgt); g.lineTo(x + w, y + hgt); g.stroke();
}
/* 团龙：圆环 + 盘龙 + 火珠 + 云头 */
function drawDragon(g, R) {
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#fff'; g.fillStyle = '#fff';
  g.lineWidth = R * .05; g.beginPath(); g.arc(0, 0, R * .96, 0, TAU); g.stroke();
  g.lineWidth = R * .02; g.beginPath(); g.arc(0, 0, R * .86, 0, TAU); g.stroke();
  for (let i = 0; i < 36; i++) { const a = i / 36 * TAU; g.beginPath(); g.arc(Math.cos(a) * R * .91, Math.sin(a) * R * .91, R * .012, 0, TAU); g.fill(); }
  const n = 150, P = [];
  for (let i = 0; i <= n; i++) { const t = i / n, a = -2.2 + t * TAU * 1.42, r = R * (.17 + .5 * Math.pow(t, .78)) + R * .04 * Math.sin(t * TAU * 5.5); P.push([Math.cos(a) * r, Math.sin(a) * r, R * (.1 * (1 - .82 * t) + .012)]); }
  const tan = i => { const a = P[Math.max(0, i - 1)], b = P[Math.min(n, i + 1)]; const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
  // 背鳍
  for (let i = 6; i < n - 4; i += 4) { const p = P[i], t = tan(i), nx = t[1], ny = -t[0], w = p[2]; g.beginPath(); g.moveTo(p[0] + nx * w * .8 - t[0] * w * .5, p[1] + ny * w * .8 - t[1] * w * .5); g.lineTo(p[0] + nx * (w + R * .055) + t[0] * w * .6, p[1] + ny * (w + R * .055) + t[1] * w * .6); g.lineTo(p[0] + nx * w * .8 + t[0] * w * .5, p[1] + ny * w * .8 + t[1] * w * .5); g.fill(); }
  // 四足
  [24, 52, 84, 112].forEach((i, k) => {
    const p = P[i], t = tan(i), sd = k % 2 ? 1 : -1, nx = -t[1] * sd, ny = t[0] * sd, L = R * .17;
    const ex = p[0] + nx * L + t[0] * L * .35, ey = p[1] + ny * L + t[1] * L * .35;
    g.lineWidth = R * .045; g.beginPath(); g.moveTo(p[0], p[1]); g.quadraticCurveTo(p[0] + nx * L * .8, p[1] + ny * L * .8, ex, ey); g.stroke();
    g.lineWidth = R * .018; const ba = Math.atan2(ey - p[1], ex - p[0]);
    for (let c = -2; c <= 2; c++) { const a = ba + c * .42; g.beginPath(); g.moveTo(ex, ey); g.quadraticCurveTo(ex + Math.cos(a) * R * .06, ey + Math.sin(a) * R * .06, ex + Math.cos(a + .5) * R * .09, ey + Math.sin(a + .5) * R * .09); g.stroke(); }
  });
  // 身体
  g.fillStyle = 'rgba(255,255,255,.62)'; for (let i = n; i >= 0; i--) { const p = P[i]; g.beginPath(); g.arc(p[0], p[1], p[2], 0, TAU); g.fill(); }
  g.lineWidth = R * .013; g.strokeStyle = '#fff';
  for (let i = 3; i < n; i += 3) { const p = P[i], t = tan(i), a = Math.atan2(t[1], t[0]); g.beginPath(); g.arc(p[0] - t[0] * p[2] * .3, p[1] - t[1] * p[2] * .3, p[2] * .78, a - 1.15, a + 1.15); g.stroke(); }
  // 尾
  const pe = P[n], te = tan(n); g.lineWidth = R * .014; for (let c = -2; c <= 2; c++) { const a = Math.atan2(te[1], te[0]) + c * .35; g.beginPath(); g.moveTo(pe[0], pe[1]); g.quadraticCurveTo(pe[0] + Math.cos(a) * R * .08, pe[1] + Math.sin(a) * R * .08, pe[0] + Math.cos(a + .6) * R * .13, pe[1] + Math.sin(a + .6) * R * .13); g.stroke(); }
  // 龙首
  const p0 = P[0], t0 = tan(1), hx = -t0[0], hy = -t0[1], ha = Math.atan2(hy, hx);
  g.save(); g.translate(p0[0], p0[1]); g.rotate(ha); g.fillStyle = '#fff';
  g.lineWidth = R * .02; for (let k = -3; k <= 3; k++) { g.beginPath(); g.moveTo(-R * .05, k * R * .025); g.quadraticCurveTo(-R * .16, k * R * .06, -R * .2, k * R * .085 + R * .03); g.stroke(); }
  g.beginPath(); g.ellipse(0, 0, R * .13, R * .1, 0, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(R * .12, 0, R * .085, R * .062, 0, 0, TAU); g.fill();
  g.lineWidth = R * .026; [[-1], [1]].forEach(([s]) => { g.beginPath(); g.moveTo(-R * .03, s * R * .07); g.quadraticCurveTo(-R * .1, s * R * .2, -R * .24, s * R * .19); g.stroke(); g.beginPath(); g.moveTo(-R * .13, s * R * .175); g.lineTo(-R * .17, s * R * .25); g.stroke(); });
  g.lineWidth = R * .014; [[-1], [1]].forEach(([s]) => { g.beginPath(); g.moveTo(R * .18, s * R * .03); g.bezierCurveTo(R * .3, s * R * .08, R * .3, s * R * .22, R * .2, s * R * .24); g.stroke(); });
  g.fillStyle = '#000'; [[-1], [1]].forEach(([s]) => { g.beginPath(); g.arc(R * .045, s * R * .05, R * .022, 0, TAU); g.fill(); });
  g.beginPath(); g.arc(R * .17, R * .02, R * .012, 0, TAU); g.arc(R * .17, -R * .02, R * .012, 0, TAU); g.fill();

  g.fillStyle = '#fff'; g.beginPath(); g.arc(fx, fy, R * .05, 0, TAU); g.fill(); g.lineWidth = R * .016;
  for (let k = 0; k < 3; k++) { const a = ha + 2.2 + k * .5; g.beginPath(); g.moveTo(fx, fy); g.quadraticCurveTo(fx + Math.cos(a) * R * .1, fy + Math.sin(a) * R * .1, fx + Math.cos(a + .7) * R * .16, fy + Math.sin(a + .7) * R * .16); g.stroke(); }
  // 边缘云头
  for (let k = 0; k < 7; k++) { const a = k / 7 * TAU + .4; curl(g, Math.cos(a) * R * .76, Math.sin(a) * R * .76, R * .05, a + 1, k % 2 ? 1 : -1, R * .016); }
  g.restore();
}
function place(g, x, y, sx, sy, fn) { g.save(); g.translate(x, y); g.scale(sx, sy); fn(g); g.restore(); }

/* ============================================================
   2. 七种材质的贴图
   ============================================================ */
/* —— 鎏金：凹处积垢发暗、凸处磨亮，偶露朱红胶底 —— */
function giltFromMask(cv, ns = 4, bgDirt = .5) {
  const w = cv.width, h = cv.height, M = blur(lum(cv), w, h, 1), B = blur(M, w, h, 9), H = new Float32Array(w * h);
  for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i++) H[i] = M[i] + .05 * S(N2, x / 512 * 3, y / 512 * 3) + .03 * S(N4, x / 256, y / 256);
  const G0 = [.78, .53, .17], G1 = [1, .84, .47], DK = [.085, .055, .03], BOLE = [.42, .1, .05];
  return bake(w, h, H, ns, (i, x, y, o) => {
    const u = x / 512, v = y / 512, m = M[i], n1 = S(N1, u * 1.5, v * 1.5), n2 = S(N2, u * 3, v * 3), n4 = S(N4, u * 2, v * 2);
    const cav = cl((B[i] - m) * 2.6 + (1 - m) * bgDirt);
    const dirt = sm(.22, .8, cav * .95 + (n1 - .5) * .55 + (n2 - .5) * .3) * .92;
    const pol = sm(.3, .95, m + (n2 - .5) * .6);
    o[0] = lerp(G0[0], G1[0], pol); o[1] = lerp(G0[1], G1[1], pol); o[2] = lerp(G0[2], G1[2], pol);
    let ro = lerp(.36, .1, pol) + (n4 - .5) * .12, me = 1;
    const bole = sm(.74, .8, n2 * .55 + S(N1, u * 4 + .37, v * 4 + .11) * .5) * sm(.55, .8, m);
    mixc(o, BOLE, bole * .85); ro = lerp(ro, .5, bole); me = lerp(me, .15, bole);
    mixc(o, DK, dirt); ro = lerp(ro, .82, dirt); me = lerp(me, .3, dirt);
    o[3] = 1 - .55 * cav; o[4] = cl(ro); o[5] = me;
  });
}
function giltTileMask() {
  const W = 1024, [c, g] = mkCanvas(W, W); g.strokeStyle = '#fff'; g.fillStyle = '#fff'; g.lineCap = 'round';
  const n = 4, s = W / n;

canvas.addEventListener('wheel', e => { e.preventDefault(); view.dist *= Math.exp(e.deltaY * .0011); tw = 1; idle = 0; }, { passive: false });
window.addEventListener('keydown', e => { if (e.key >= '0' && e.key <= '7') focus(+e.key); if (e.key === ' ') toggleAuto(); });
const $auto = document.getElementById('auto'); function toggleAuto() { auto = !auto; $auto.textContent = '自動慢轉：' + (auto ? '開' : '關'); } $auto.onclick = toggleAuto;
window.addEventListener('resize', resize);

/* ============================================================
   7. 启动
   ============================================================ */
const clock = new THREE.Clock(); let T = 0;
function frame() {
  const dt = Math.min(.05, clock.getDelta()); T += dt;
  if (tw < 1) { tw = Math.min(1, tw + dt / 2.2); const k = tw * tw * tw * (tw * (tw * 6 - 15) + 10), v = VIEWS[cur]; view.t.set(lerp(from.t.x, v.t[0], k), lerp(from.t.y, v.t[1], k), lerp(from.t.z, v.t[2], k)); view.az = lerp(from.az, v.az, k); view.pol = lerp(from.pol, v.pol, k); view.dist = lerp(from.dist, v.dist, k); }
  else if (!dragging) { idle += dt; if (auto && idle > 2.5) { const v = VIEWS[cur], ease = Math.min(1, (idle - 2.5) / 2); if (view.az > v.az + v.sway) autoDir = -1; else if (view.az < v.az - v.sway) autoDir = 1; view.az += autoDir * .045 * dt * ease; } }
  applyCam();
  flames.forEach(f => { f.quaternion.copy(camera.quaternion); if (f.parent) { f.parent.updateWorldMatrix(true, false); _q.setFromRotationMatrix(f.parent.matrixWorld).invert(); f.quaternion.premultiply(_q); } f.material.uniforms.uTime.value = T; });
  candleLights.forEach(L => { const s = L.userData.seed, fl = .9 + .07 * Math.sin(T * 9.1 + s) + .05 * Math.sin(T * 14.7 + s * 2) + .04 * Math.sin(T * 3.3 + s * 3); L.intensity = L.userData.base * fl; });
  smokeMesh.rotation.y = Math.atan2(camera.position.x - smokeMesh.position.x, camera.position.z - smokeMesh.position.z);
  smokeMat.uniforms.uTime.value = T; moteMat.uniforms.uTime.value = T; beamMat.uniforms.uTime.value = T;
  renderFrame(T);
  requestAnimationFrame(frame);
}
const _q = new THREE.Quaternion();
(async function main() {
  try {
    await document.fonts.ready;
    await buildTextures();
    await tick('立柱懸匾…', .93);
    buildFX(); buildHall(); buildPlaque(); buildCurtains(); buildAltar(); buildStatue(); buildBeam(); buildLights(); setupFloorReflection();
    await tick('點燭…', .98);
    resize(); focus(+(QS.get('v') || 0), true); applyCam();
    renderer.shadowMap.needsUpdate = true; renderer.compile(scene, camera);
    let n = 0; const kick = () => { renderer.shadowMap.needsUpdate = true; if (++n < 4) setTimeout(kick, 400); }; kick();
    if (QS.get('auto') === '0') toggleAuto();
    requestAnimationFrame(frame);
    setTimeout(() => { const l = document.getElementById('load'); l.style.opacity = 0; setTimeout(() => l.remove(), 1300); window.__ready = true; }, 300);
    window.__focus = focus; window.__view = view; window.__THREE = THREE; window.__scene = scene; window.__renderer = renderer;
  } catch (e) { console.error(e); $lt.textContent = '載入失敗：' + e.message; }
})();
</script>
