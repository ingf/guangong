<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0604">
<title>关帝庙 · 在线参拜</title>
<style>
:root{--kai:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC","楷体",serif;--song:"Noto Serif SC","Songti SC","STSong","SimSun","Source Han Serif SC",serif;--gold:#e6c273;--gold2:#a8802f;--red:#7a1410}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050302;overflow:hidden;color:var(--gold);font-family:var(--song);touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5;pointer-events:none;opacity:0;transition:opacity 1.6s}
body.in .hud{opacity:1}
#tag{left:calc(14px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));display:flex;gap:10px;align-items:center;text-shadow:0 1px 6px #000}
#tag .seal{width:38px;height:38px;border-radius:5px;background:linear-gradient(135deg,#a3201a,#6a0f0b);color:#f6dfae;font:22px/38px var(--kai);text-align:center;box-shadow:0 0 0 1px #d8a85a55,0 2px 10px #000a}
#tag b{display:block;font:600 17px/1.25 var(--song);letter-spacing:.08em;color:#f3dba0}
#tag i{display:block;font:normal 12px/1.4 var(--song);color:#b99a5e;letter-spacing:.2em}
#tools{right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto}
.tb{pointer-events:auto;cursor:pointer;border:1px solid #c9a25a66;background:#120a06b0;color:#e6c273;font:14px/1 var(--song);letter-spacing:.15em;padding:9px 12px 9px 14px;border-radius:3px;backdrop-filter:blur(4px)}
.tb:active{background:#3a1a10}
#bar{left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:clamp(10px,3.4vw,30px)}
.act{pointer-events:auto;cursor:pointer;border:0;background:none;padding:0;color:#f1d9a0;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--song)}
.act span{width:clamp(56px,15vw,72px);height:clamp(56px,15vw,72px);border-radius:50%;display:grid;place-items:center;font:clamp(28px,7.6vw,36px)/1 var(--kai);color:#f8e3b0;
 background:radial-gradient(circle at 35% 28%,#b3302a,#6b100c 55%,#2e0705);box-shadow:0 0 0 2px #1a0d07,0 0 0 3.5px #c79b4e,0 0 0 5px #1a0d07,0 6px 18px #000c,inset 0 2px 6px #ffb08055;transition:transform .15s,filter .2s;text-shadow:0 2px 3px #3008}
.act em{font:normal 12px/1 var(--song);letter-spacing:.3em;margin-right:-.3em;color:#cfb074;text-shadow:0 1px 4px #000}
.act:active span{transform:scale(.92);filter:brightness(1.3)}
.act.off{opacity:.45;pointer-events:none}
#hint{left:0;right:0;bottom:calc(118px + env(safe-area-inset-bottom));text-align:center;font:13px/1.6 var(--song);letter-spacing:.28em;color:#c9ac70;text-shadow:0 1px 8px #000,0 0 2px #000}
#rite{position:fixed;z-index:6;left:0;right:0;top:30%;text-align:center;pointer-events:none;font:clamp(64px,17vw,132px)/1 var(--kai);color:#ffe9b0;letter-spacing:.12em;margin-right:-.12em;opacity:0;
 text-shadow:0 0 30px #ffb44a,0 0 80px #c0580a,0 4px 10px #000}
#rite small{display:block;font:clamp(14px,3.6vw,20px)/2.4 var(--song);letter-spacing:.5em;margin-right:-.5em;color:#e9cf93;text-shadow:0 1px 8px #000}
#rite.show{animation:rite 2.6s ease both}
@keyframes rite{0%{opacity:0;transform:scale(1.25);filter:blur(8px)}18%{opacity:1;transform:scale(1);filter:blur(0)}75%{opacity:1}100%{opacity:0;transform:scale(.97)}}
#toast{position:fixed;z-index:6;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);pointer-events:none;font:14px/1.5 var(--song);letter-spacing:.2em;color:#f0d79b;background:linear-gradient(90deg,#0000,#120a06d0 18%,#120a06d0 82%,#0000);padding:8px 44px;white-space:nowrap;opacity:0;transition:opacity .6s}
#toast.show{opacity:1}
#gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,22px);text-align:center;
 background:radial-gradient(ellipse at 50% 42%,#2a0f08 0%,#0b0503 62%,#030201 100%);transition:opacity 1.8s ease,visibility 1.8s}
#gate.gone{opacity:0;visibility:hidden;pointer-events:none}
#gate h1{margin:0;font:clamp(72px,19vw,150px)/1.05 var(--kai);font-weight:400;letter-spacing:.14em;margin-right:-.14em;background:linear-gradient(180deg,#fff0bf,#e2b55a 45%,#8f5e1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 22px #c2691b66)}
#gate h2{margin:0;font:500 clamp(13px,3.4vw,17px)/1 var(--song);letter-spacing:.8em;margin-right:-.8em;color:#b08f52}
#gate .rule{width:min(300px,60vw);height:1px;background:linear-gradient(90deg,#0000,#c9a25a,#0000)}
#gate p{margin:0;font:clamp(13px,3.5vw,15px)/1.9 var(--song);color:#a58a58;letter-spacing:.2em}
#gate p b{display:block;font:600 clamp(20px,5.4vw,26px)/1.6 var(--song);color:#f3dba0;letter-spacing:.14em}
#enter{margin-top:8px;cursor:pointer;font:clamp(20px,5.4vw,24px)/1 var(--kai);letter-spacing:.4em;padding:16px 26px 16px 38px;color:#f8e3b0;border:1px solid #c79b4e;background:linear-gradient(180deg,#8f1d17,#4d0b08);border-radius:2px;box-shadow:0 0 0 4px #150906,0 0 0 5px #c79b4e66,0 10px 30px #000;transition:opacity .5s,filter .2s}
#enter[disabled]{opacity:.35;cursor:default}
#enter:not([disabled]):hover{filter:brightness(1.25)}
#load{height:18px;font:12px/18px var(--song);letter-spacing:.3em;color:#7d6a45}
#card{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:#040201c0;opacity:0;visibility:hidden;transition:opacity 1.2s,visibility 1.2s;backdrop-filter:blur(3px)}
#card.show{opacity:1;visibility:visible}
#tie{position:relative;width:min(92vw,640px);height:min(80vh,580px);padding:26px 22px 62px;color:#3b1408;
 background:radial-gradient(ellipse at 30% 20%,#f6e3b4,#e7c98a 60%,#d2ac66);border:1px solid #7a4a16;box-shadow:0 0 0 6px #7a1410,0 0 0 8px #d9b25e,0 0 0 9px #3a0a06,0 30px 90px #000;transform:translateY(24px) scale(.96);transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
#card.show #tie{transform:none}
#tie:before{content:"";position:absolute;inset:8px;border:1px solid #8a2a1a88;pointer-events:none}
#tie .body{height:100%;width:100%;writing-mode:vertical-rl;font:clamp(12.5px,2.2vh,17px)/1.5 var(--song);letter-spacing:.14em;overflow:auto}
#tie h3{margin:0 0 0 10px;font:clamp(28px,5vh,46px)/1.15 var(--kai);font-weight:400;color:#8a1510;letter-spacing:.2em}
#tie .who{font-weight:600;color:#5a1208;margin:0 2px}
#tie .who u{text-decoration:none;display:inline-block;font:.82em var(--kai);color:#f6e3b4;background:#a3201a;padding:6px 2px;margin-top:8px;border-radius:2px;letter-spacing:.05em}
#tie p{margin:0 3px}
#tie .date{color:#7a4a16;margin-right:6px}
#tie .stamp{position:absolute;left:20px;bottom:10px;width:46px;height:46px;border:2px solid #a3201a;border-radius:4px;color:#a3201a;font:18px/20px var(--kai);display:grid;place-items:center;text-align:center;transform:rotate(-6deg);opacity:.85;writing-mode:horizontal-tb}
#tieok{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);cursor:pointer;border:1px solid #7a1410;background:#8f1d17;color:#f8e3b0;font:17px/1 var(--kai);letter-spacing:.4em;padding:10px 18px 10px 26px;border-radius:2px}
#err{position:fixed;inset:0;z-index:30;display:none;place-items:center;text-align:center;padding:30px;background:#050302;color:#c9a25a;font:15px/2 var(--song)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tag" class="hud"><div class="seal">谒</div><div><b id="nm"></b><i id="ttl"></i></div></div>
<div id="tools" class="hud"><button class="tb" id="bgaze">瞻仰</button><button class="tb" id="bsnd">声 · 开</button></div>
<div id="hint" class="hud"></div>
<div id="bar" class="hud">
 <button class="act" id="a-incense"><span>香</span><em>上香</em></button>
 <button class="act" id="a-bow"><span>拜</span><em>敬拜</em></button>
 <button class="act" id="a-bell"><span>钟</span><em>鸣钟</em></button>
 <button class="act" id="a-drum"><span>鼓</span><em>擂鼓</em></button>
</div>
<div id="rite"></div><div id="toast"></div>
<div id="card"><div id="tie"><div class="body" id="tiebody"></div><div class="stamp">桃园<br>结义</div><button id="tieok">收下此帖</button></div></div>
<div id="gate">
 <h2>忠义千秋 · 在线参拜</h2><h1>关帝庙</h1><div class="rule"></div>
 <p>阁下此来，名号<b id="gname"></b><span id="gttl"></span></p>
 <button id="enter" disabled>入殿参拜</button><div id="load">正在起殿…</div>
</div>
<div id="err"></div>
<script>
(async()=>{
'use strict';
const $=s=>document.querySelector(s), qs=new URLSearchParams(location.search);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const setLoad=async s=>{$('#load').textContent=s;await sleep(16);};
const fail=m=>{const e=$('#err');e.style.display='grid';e.innerHTML=m;};

/* ---------- 名号 ---------- */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const JUN=['涿郡','河东','常山','南阳','琅琊','陇西','谯郡','吴郡','颍川','襄阳','西凉','巴西','零陵','江夏','汝南','北海','会稽','天水','武陵','荆州','益州','幽州','并州','庐江','东莱','义阳','南郡','扶风'];
const XING=['刘','关','张','赵','马','黄','曹','孙','周','鲁','吕','陆','姜','魏','庞','徐','甘','严','廖','王','李','陈','邓','诸葛','夏侯','司马','太史','公孙','糜','简','向','费','蒋','法','凌','丁','韩','程','荀','郭'];
const MING=['靖','骁','翊','毅','昭','衡','恪','劭','朗','峻','骏','威','烈','猛','震','霆','岳','嵩','渊','邈','彰','曜','晔','谌','恢','纮','凯','骘','肃','弘','谦','允','济','焕','彪','钧','铮','骥','羽翼'.slice(0,1),'翱'];
const ZA=['子','伯','仲','叔','季','文','公','元','孟','德','士','奉','云','汉','孝','幼','玄','翼','兴','承','景','长','君','义'];
const ZB=['龙','德','长','达','明','远','义','谦','起','常','平','则','敬','烈','威','先','嗣','言','台','渊','举','直','山','节','升','坚','忠','信','武','烈','国','方','度','然','休','初','卿'];
const TTL=['忠义校尉','荡寇都尉','别部司马','牙门将','骑都尉','偏将军','帐前主簿','讨逆从事','虎贲中郎','奋威校尉','扬武都尉','护军司马','布衣义士','江湖游侠','桑梓义民'];
const mkName=()=>{const j=pick(JUN),x=pick(XING),m=pick(MING),z=pick(ZA)+pick(ZB);return{full:j+x+m,zi:z,ttl:pick(TTL),str:`${j}${x}${m} 字${z}`};};
const me=mkName();
$('#gname').textContent=me.str;$('#gttl').textContent=me.ttl;$('#nm').textContent=me.str;$('#ttl').textContent=me.ttl;
const fated=qs.has('jieyi')?qs.get('jieyi')==='1':Math.random()<0.3;

/* ---------- 载入 three ---------- */
const CDNS=['https://cdn.jsdelivr.net/npm/three@0.160.0','https://unpkg.com/three@0.160.0','https://fastly.jsdelivr.net/npm/three@0.160.0','https://registry.npmmirror.com/three/0.160.0/files'];
let base=null;
for(const c of CDNS){try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),7000);const r=await fetch(c+'/build/three.module.js',{signal:ctl.signal});clearTimeout(tm);if(r.ok){base=c;break;}}catch(e){}}
if(!base){fail('无法从 CDN 载入渲染库，请检查网络后重试。');return;}
const im=document.createElement('script');im.type='importmap';im.textContent=JSON.stringify({imports:{three:base+'/build/three.module.js','three/addons/':base+'/examples/jsm/'}});document.head.appendChild(im);
let THREE,EffectComposer,RenderPass,UnrealBloomPass,ShaderPass,OutputPass;
try{
 THREE=await import('three');
 [{EffectComposer},{RenderPass},{UnrealBloomPass},{ShaderPass},{OutputPass}]=await Promise.all(['EffectComposer','RenderPass','UnrealBloomPass','ShaderPass','OutputPass'].map(n=>import(`three/addons/postprocessing/${n}.js`)));
}catch(e){fail('渲染库载入失败：'+e);return;}

/* 字体（可选，失败则回退系统字体） */
const FONTCH='志在春秋功汉心同日月义天忠千威震华夏薄云关蜀寿亭侯之印帅勇仁';
await setLoad('正在研墨…');
try{
 const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;600;900&display=swap';document.head.appendChild(l);
 await Promise.race([new Promise(r=>{l.onload=r;l.onerror=r;}),sleep(3500)]);
 await Promise.race([Promise.all([document.fonts.load('64px "Ma Shan Zheng"',FONTCH),document.fonts.load('900 64px "Noto Serif SC"',FONTCH)]),sleep(5000)]);
}catch(e){}
const KAI='"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif',SONG='"Noto Serif SC","Songti SC","SimSun",serif';

/* ---------- 基础 ---------- */
const MOBILE=matchMedia('(pointer:coarse)').matches||Math.min(innerWidth,innerHeight)<600;
const LOW=qs.get('q')==='low';
const canvas=$('#c');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});}catch(e){fail('此设备不支持 WebGL，无法入殿。');return;}
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.92;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050302);scene.fog=new THREE.FogExp2(0x0b0705,0.016);
const camera=new THREE.PerspectiveCamera(46,1,0.1,80);
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const sat=x=>x<0?0:x>1?1:x,mix=(a,b,t)=>a+(b-a)*t,sstep=(a,b,x)=>{const t=sat((x-a)/(b-a));return t*t*(3-2*t);},fract=x=>x-Math.floor(x);
let seed=20261111;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const rr=(a,b)=>a+(b-a)*rnd();

/* ---------- 程序化贴图 ---------- */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d',{willReadFrequently:true})];}
const ANISO=Math.min(8,renderer.capabilities.getMaxAnisotropy());
function tex(c,{srgb=true,rep=null,wrap=false}={}){if(wrap&&!rep)rep=[1,1];const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}t.anisotropy=ANISO;return t;}
function hash(i,j,s){let h=(Math.imul(i,374761393)+Math.imul(j,668265263)+Math.imul(s,1274126177))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vn(x,y,px,py,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const x0=((xi%px)+px)%px,x1=(x0+1)%px,y0=((yi%py)+py)%py,y1=(y0+1)%py;
 const a=hash(x0,y0,s),b=hash(x1,y0,s),c=hash(x0,y1,s),d=hash(x1,y1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(u,v,px,py,oct,s){let a=0,amp=.5;for(let o=0;o<oct;o++){a+=amp*vn(u*px,v*py,px,py,s+o*17);amp*=.5;px*=2;py*=2;}return a;}
function genTex(S,fn,{ns=2,rep=null}={}){
 const H=new Float32Array(S*S),[cc,cg]=cv(S,S),[oc,og]=cv(S,S),[nc,ng]=cv(S,S);
 const cd=cg.createImageData(S,S),od=og.createImageData(S,S),nd=ng.createImageData(S,S),o=[0,0,0,0,.5,0];
 for(let j=0,k=0;j<S;j++)for(let i=0;i<S;i++,k++){fn(i/S,j/S,o,k);H[k]=o[0];const q=k*4;cd.data[q]=o[1]*255;cd.data[q+1]=o[2]*255;cd.data[q+2]=o[3]*255;cd.data[q+3]=255;od.data[q]=255;od.data[q+1]=o[4]*255;od.data[q+2]=o[5]*255;od.data[q+3]=255;}
 for(let j=0,k=0;j<S;j++)for(let i=0;i<S;i++,k++){const dx=(H[j*S+(i+1)%S]-H[j*S+(i+S-1)%S])*ns*S/256,dy=(H[((j+1)%S)*S+i]-H[((j+S-1)%S)*S+i])*ns*S/256,l=1/Math.hypot(dx,dy,1),q=k*4;
  nd.data[q]=(-dx*l*.5+.5)*255;nd.data[q+1]=(dy*l*.5+.5)*255;nd.data[q+2]=(l*.5+.5)*255;nd.data[q+3]=255;}
 cg.putImageData(cd,0,0);og.putImageData(od,0,0);ng.putImageData(nd,0,0);
 return{map:tex(cc,{rep,wrap:true}),normalMap:tex(nc,{srgb:false,rep,wrap:true}),orm:tex(oc,{srgb:false,rep,wrap:true})};
}
function carve(S,draw,blur=2){const[c,g]=cv(S,S);g.fillStyle='#000';g.fillRect(0,0,S,S);g.strokeStyle=g.fillStyle='#fff';g.lineCap=g.lineJoin='round';draw(g,S);
 const d=g.getImageData(0,0,S,S).data;let a=new Float32Array(S*S),b=new Float32Array(S*S);for(let i=0;i<S*S;i++)a[i]=d[i*4]/255;
 for(let p=0;p<2&&blur>0;p++){for(let j=0;j<S;j++)for(let i=0;i<S;i++){let s=0;for(let k=-blur;k<=blur;k++)s+=a[j*S+(i+k+S)%S];b[j*S+i]=s/(2*blur+1);}
  for(let j=0;j<S;j++)for(let i=0;i<S;i++){let s=0;for(let k=-blur;k<=blur;k++)s+=b[((j+k+S)%S)*S+i];a[j*S+i]=s/(2*blur+1);}}
 return a;}
function spiral(g,x,y,r,turns,dir,lw,ph=0){g.beginPath();const T=turns*6.283;for(let a=0;a<=T;a+=.12){const q=r*(1-a/T*.88),px=x+Math.cos(a*dir+ph)*q,py=y+Math.sin(a*dir+ph)*q;a?g.lineTo(px,py):g.moveTo(px,py);}g.lineWidth=lw;g.stroke();}
function clouds(g,S,n,r0,r1,lw){for(let i=0;i<n;i++){const x=rnd()*S,y=rnd()*S,r=rr(r0,r1)*S,d=rnd()<.5?1:-1,ph=rnd()*6.28;for(const ox of[-S,0,S])for(const oy of[-S,0,S]){spiral(g,x+ox,y+oy,r,2.2,d,lw*S,ph);spiral(g,x+ox+r*1.5*d,y+oy+r*.4,r*.6,1.8,-d,lw*S*.8,ph+2);}}}
function meander(g,x0,y0,w,h,n,lw){g.lineWidth=lw;const s=w/n;for(let i=0;i<n;i++){const x=x0+i*s;g.beginPath();g.moveTo(x,y0+h);g.lineTo(x,y0);g.lineTo(x+s*.8,y0);g.lineTo(x+s*.8,y0+h*.75);g.lineTo(x+s*.3,y0+h*.75);g.lineTo(x+s*.3,y0+h*.38);g.lineTo(x+s*.55,y0+h*.38);g.stroke();g.beginPath();g.moveTo(x,y0+h);g.lineTo(x+s,y0+h);g.stroke();}}

 const X=t=>S*(.5+dir*(.11+.3*(.5-.5*Math.cos(t*7.6))*(.45+.55*t))),Y=t=>S*(.2+.7*t+.03*Math.sin(t*15)),R=t=>S*.043*(1-.78*t)+2;

function smin(a,b,k){const h=Math.max(k-Math.abs(a-b),0)/k;return Math.min(a,b)-h*h*k*.25;}
function smax(a,b,k){return-smin(-a,-b,k);}
function sph(x,y,z,cx,cy,cz,r){x-=cx;y-=cy;z-=cz;return Math.sqrt(x*x+y*y+z*z)-r;}

function rc(x,y,z,ax,ay,az,bx,by,bz,r1,r2){const pax=x-ax,pay=y-ay,paz=z-az,bax=bx-ax,bay=by-ay,baz=bz-az;let h=(pax*bax+pay*bay+paz*baz)/(bax*bax+bay*bay+baz*baz);h=h<0?0:h>1?1:h;const dx=pax-bax*h,dy=pay-bay*h,dz=paz-baz*h;return Math.sqrt(dx*dx+dy*dy+dz*dz)-(r1+(r2-r1)*h);}

function sDrum(B,t,v=1){const c=B.ctx;const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(165,t);o.frequency.exponentialRampToValueAtTime(62,t+.11);o.frequency.exponentialRampToValueAtTime(54,t+1);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.8*v,t+.004);g.gain.exponentialRampToValueAtTime(1e-4,t+1.25);o.connect(g);g.connect(B.out);const sg=c.createGain();sg.gain.value=.35;g.connect(sg);sg.connect(B.rev);o.start(t);o.stop(t+1.3);
 partial(B,t,97,.28*v,.5,.3);partial(B,t,143,.16*v,.3,.3);partial(B,t,41,.3*v,1.5,0);nburst(B,t,'lowpass',1700,.6,.5*v,.06,.4);nburst(B,t,'bandpass',420,1.2,.3*v,.16,.3);}
function sQing(B,t,f=587,v=1){const R=[1,2.76,5.4,8.93],A=[1,.45,.2,.08],D=[5.5,3.2,1.8,1];for(let i=0;i<4;i++)partial(B,t,f*R[i],A[i]*.13*v,D[i],.35,i==0?.7:0);nburst(B,t,'bandpass',f*4,2,.05*v,.03,.2);}
function sAmbient(B,t){const c=B.ctx,s=c.createBufferSource();s.buffer=B.brown;s.loop=true;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=240;const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.085,t+3);s.connect(f);f.connect(g);g.connect(B.out);s.start(t);
 const ng=c.createGain();ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(.006,t+3);const s2=c.createBufferSource();s2.buffer=B.noise;s2.loop=true;const f2=c.createBiquadFilter();f2.type='bandpass';f2.frequency.value=2600;f2.Q.value=.4;s2.connect(f2);f2.connect(ng);ng.connect(B.out);s2.start(t);
 for(const[fr,a,lf]of[[55,.03,.07],[82.5,.018,.11],[110.3,.008,.05]]){const o=c.createOscillator();o.frequency.value=fr;const og=c.createGain();og.gain.setValueAtTime(0,t);og.gain.linearRampToValueAtTime(a,t+4);const l=c.createOscillator();l.frequency.value=lf;const lg=c.createGain();lg.gain.value=a*.5;l.connect(lg);lg.connect(og.gain);o.connect(og);og.connect(B.out);o.start(t);l.start(t);}}
let AB=null,sndOn=true;
function audioInit(){if(AB)return;try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();AB=mkBus(ctx);sAmbient(AB,ctx.currentTime+.05);}catch(e){AB=null;}}
const play=(fn,...a)=>{if(!AB||!sndOn)return;if(AB.ctx.state==='suspended')AB.ctx.resume();fn(AB,AB.ctx.currentTime+.02,...a);};
window.__audioTest=async()=>{const res={};const cases={bell:[9,B=>sBell(B,.05)],drum:[2.5,B=>sDrum(B,.05)],qing:[5,B=>sQing(B,.05)],ambient:[8,B=>sAmbient(B,0)],worst:[6,B=>{sAmbient(B,0);sBell(B,.5);sBell(B,1.2);for(let i=0;i<8;i++)sDrum(B,.5+i*.22);sQing(B,.6);sQing(B,.9,440);}]};
 for(const k in cases){const[dur,fn]=cases[k],sr=44100,oc=new OfflineAudioContext(2,sr*dur,sr),B=mkBus(oc);fn(B);const buf=await oc.startRendering(),d=buf.getChannelData(0);let peak=0,sq=0,clip=0,first=-1,run=0,maxRun=0,nan=0,dc=0;
  for(let i=0;i<d.length;i++){const a=Math.abs(d[i]);if(!isFinite(a)){nan++;continue;}if(a>peak)peak=a;sq+=a*a;dc+=d[i];if(a>=.999)clip++;if(first<0&&a>1e-3)first=i/sr;if(i<d.length*.6){if(a<1e-4){run++;if(run>maxRun)maxRun=run;}else run=0;}}
  res[k]={dur,peak:+peak.toFixed(3),rms:+Math.sqrt(sq/d.length).toFixed(4),clipped:clip,firstSound:+first.toFixed(3),longestSilenceSec:+(maxRun/sr).toFixed(3),nan,dc:+(dc/d.length).toFixed(5)};}
 return res;};

/* ---------- 仪轨 ---------- */
const st={incense:0,bows:0,busy:false,done:false,jieyi:false,entered:false};
const hint=s=>{$('#hint').textContent=s;};
let toastT=0;const toast=(s,ms=3200)=>{const e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),ms);};
const rite=(big,small='')=>{const e=$('#rite');e.classList.remove('show');e.innerHTML=big+(small?`<small>${small}</small>`:'');void e.offsetWidth;e.classList.add('show');};
const lock=b=>{st.busy=b;for(const id of['#a-incense','#a-bow'])$(id).classList.toggle('off',b);};
let stickCur=0;
async function doIncense(){if(st.busy)return;lock(true);setView('incense');hint('拈香三炷 · 敬奉关圣帝君');await wait(1.0);
 const grp=(stickCur++)%3;
 for(let i=0;i<3;i++){const s=userSticks[grp*3+i];s.g.visible=true;s.tip.material.color.setRGB(3.5,1.1,.25);const h=s.home;tw(.9,k=>{s.g.position.set(h.x+(1-k)*.5,h.y+(1-k)*.75,h.z+(1-k)*1.3);},eout);play(sQing,880+i*220,.35);await wait(.45);}
 await wait(.6);for(let i=0;i<3;i++){const m=L.userSmoke[i];m.uniforms.sd.value+=grp;tw(2.5,k=>{m.uniforms.op.value=Math.max(m.uniforms.op.value,k*.95);});}
 tw(2,k=>{burner.userData.glow.material.opacity=.25+.35*Math.sin(k*Math.PI);});
 st.incense+=3;rite('上香','清香三炷 · 忠义千秋');toast(`${me.full} 敬香三炷 · 香火共 ${st.incense} 炷`);await wait(3.2);
 lock(false);hint(st.done?'心诚则灵 · 可再敬香、鸣钟、擂鼓':'香已敬上 · 请于蒲团前敬拜，三拜礼成');setView('main');}
const BOWN=['一拜','再拜','三拜'],BOWS=['一拜 · 敬其忠','再拜 · 敬其义','三拜 · 敬其勇'];
async function doBow(){if(st.busy)return;lock(true);clearTimeout(viewTimer);if(cam.view!=='bow'){setView('bow');await wait(1.1);}
 const n=st.bows;rite(BOWN[n],BOWS[n].split(' · ')[1]);play(sQing,[392,440,523][n],.8);
 await tw(1.05,k=>{cam.bow=k;});await wait(.45);await tw(1.2,k=>{cam.bow=1-k;});st.bows++;
 if(st.bows<3){lock(false);hint(`${BOWN[n]}已毕 · 请${BOWN[n+1]}（${st.bows}/3）`);$('#a-bow em').textContent=BOWN[st.bows];viewTimer=setTimeout(()=>{if(cam.view==='bow'&&!st.busy)setView('main');},15000);return;}
 // 礼成
 st.bows=0;st.done=true;$('#a-bow em').textContent='敬拜';await wait(.3);rite('礼成','三拜已毕 · 关圣垂鉴');play(sBell,1);play(sQing,784,.5);
 const k0=L.key.intensity;tw(4.5,k=>{const e=Math.sin(k*Math.PI);L.key.intensity=k0*(1+1.3*e);finalPass.uniforms.flash.value=.16*e;dustM.uniforms.gain.value=1+3*e;bloom.strength=.34+.5*e;},k=>k);
 setView('gaze');await wait(4.6);L.key.intensity=k0;
 if(fated&&!st.jieyi){st.jieyi=true;await jieyi();}else{toast('礼成 · 愿君忠义存心，诸事顺遂',4500);}
 lock(false);hint('礼成 · 可再敬香、鸣钟、擂鼓');setView('main');}
const CN=n=>{const d='〇一二三四五六七八九';if(n<=10)return n===10?'十':d[n];if(n<20)return'十'+d[n-10];if(n%10===0)return d[n/10|0]+'十';return d[n/10|0]+'十'+d[n%10];};
async function jieyi(){
 setView('main');toast('殿外忽有桃花纷落……',4000);tw(3,k=>{petalM.uniforms.op.value=k;});play(sQing,659,.6);await wait(1.2);play(sQing,988,.5);await wait(2.2);
 const a=mkName(),b=mkName();const ppl=[{n:me,me:true},{n:a},{n:b}].map(p=>({...p,age:Math.random()})).sort((x,y)=>y.age-x.age);
 const now=new Date(),gz='甲乙丙丁戊己庚辛壬癸'[(now.getFullYear()-4)%10]+'子丑寅卯辰巳午未申酉戌亥'[(now.getFullYear()-4)%12];
 const rk=['长兄','次弟','三弟'];
 $('#tiebody').innerHTML=`<h3>桃园结义帖</h3><p class="date">岁在${gz} · ${CN(now.getMonth()+1)}月${CN(now.getDate())}日</p><p>于关圣帝君座前，焚香再拜，三人结为异姓兄弟：</p>`+
  ppl.map((p,i)=>`<p class="who">${rk[i]}　${p.n.full}　字${p.n.zi}${p.me?'<u>君</u>':''}</p>`).join('')+
  `<p>念我三人，虽然异姓，既结为兄弟，则同心协力，救困扶危；上报国家，下安黎庶。不求同年同月同日生，只愿同年同月同日死。皇天后土，实鉴此心；背义忘恩，天人共戮。</p>`;
 $('#card').classList.add('show');play(sBell,.7);rite('结义','桃园三结义 · 一世兄弟');
 await new Promise(r=>{$('#tieok').onclick=r;});$('#card').classList.remove('show');
 const o=ppl.filter(p=>!p.me).map(p=>p.n.full).join('、');toast(`已与 ${o} 结为兄弟`,6000);tw(8,k=>{petalM.uniforms.op.value=1-k;});}
let bellBusy=false,drumN=0;
async function strikeBell(){if(cam.view!=='bell')setView('bell',9);else{clearTimeout(viewTimer);viewTimer=setTimeout(()=>{if(cam.view==='bell')setView('main');},9000);}
 if(bellBusy)return;bellBusy=true;hint('晨钟一响 · 声闻于天');const p=bell.pivot;await tw(.55,k=>{p.rotation.x=-.34*k;},eout);await tw(.3,k=>{p.rotation.x=-.34+.375*k*k;},k=>k);
 play(sBell,1);bell.hitT=performance.now()/1000;await tw(.5,k=>{p.rotation.x=.035-.1*Math.sin(k*Math.PI)*(1-k);});p.rotation.x=0;bellBusy=false;}
function strikeDrum(){if(cam.view!=='drum')setView('drum',8);else{clearTimeout(viewTimer);viewTimer=setTimeout(()=>{if(cam.view==='drum')setView('main');},8000);}
 hint('战鼓雷鸣 · 威震华夏');const s=drum.sticks[drumN++%2];tw(.085,k=>{s.rotation.x=.12-.62*k;},k=>k*k).then(()=>{play(sDrum,.85+Math.random()*.3);drum.hitT=performance.now()/1000;tw(.3,k=>{s.rotation.x=-.5+.62*k;},eout);});}
const ACT={incense:doIncense,bow:doBow,bell:strikeBell,drum:strikeDrum,gaze:()=>setView(cam.view==='gaze'?'main':'gaze')};

/* ---------- 输入 ---------- */
function bindInput(){
 for(const k of['incense','bow','bell','drum'])$('#a-'+k).addEventListener('click',e=>{e.stopPropagation();ACT[k]();});
 $('#bgaze').addEventListener('click',()=>{if(!st.busy)ACT.gaze();});
 $('#bsnd').addEventListener('click',()=>{sndOn=!sndOn;$('#bsnd').textContent=sndOn?'声 · 开':'声 · 关';if(AB)AB.out.gain.setTargetAtTime(sndOn?.85:0,AB.ctx.currentTime,.1);});
 const ptr=new Map();let moved=0,pinch=0;const ray=new THREE.Raycaster(),nd=new THREE.Vector2();
 const pickAt=(x,y)=>{nd.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(nd,camera);const h=ray.intersectObjects(hits,false)[0];return h?h.object.userData.act:null;};
 canvas.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;if(ptr.size===2){const[a,b]=[...ptr.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);}try{canvas.setPointerCapture(e.pointerId);}catch(_){}} );
 canvas.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p){if(!MOBILE)canvas.style.cursor=pickAt(e.clientX,e.clientY)?'pointer':'grab';return;}const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptr.size===2){const[a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch>0)cam.zoomT=Math.min(1.15,Math.max(.5,cam.zoomT*pinch/d));pinch=d;return;}
  const s=camera.fov/50*2.2/innerHeight;cam.yawT=Math.min(.75,Math.max(-.75,cam.yawT+dx*s));cam.pitchT=Math.min(.4,Math.max(-.3,cam.pitchT+dy*s));});
 const up=e=>{if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);if(moved<8&&e.type==='pointerup'&&st.entered){const a=pickAt(e.clientX,e.clientY);if(a&&!(st.busy&&(a==='gaze'||a==='incense'||a==='bow')))ACT[a]();}};
 canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
 canvas.addEventListener('wheel',e=>{e.preventDefault();cam.zoomT=Math.min(1.15,Math.max(.5,cam.zoomT*(1+Math.sign(e.deltaY)*.08)));},{passive:false});
 addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));
 document.addEventListener('visibilitychange',()=>{if(AB){document.hidden?AB.ctx.suspend():AB.ctx.resume();}});
}

/* ---------- 主循环 ---------- */
const clock=new THREE.Clock();let T0=0;const TS=+qs.get('ts')||1;
function frame(){requestAnimationFrame(frame);if(document.hidden)return;const dt=Math.min(clock.getDelta(),.05)*TS;T0+=dt;const t=T0;
 for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const k=Math.min(w.t/w.dur,1);w.fn(w.ease(k));if(k>=1){tweens.splice(i,1);w.r();}}
 for(const f of anim)f(t);
 for(const o of flames){const n=Math.sin(t*11+o.ph)*.5+Math.sin(t*17.3+o.ph*2)*.3+Math.sin(t*5.1+o.ph*3)*.2;o.f.scale.set(.09*o.s*(1+n*.06),.2*o.s*(1+n*.12),1);o.f.position.y=o.y+n*.006*o.s;o.g.material.opacity=.32+n*.06;}
 for(let i=0;i<L.c.length;i++){const p=L.c[i];p.intensity=p.userData.i*(1+.1*Math.sin(t*9+i*2.1)+.07*Math.sin(t*15.7+i*4.3)+.05*Math.sin(t*3.3+i));}
 for(const m of smokeMats)m.uniforms.t.value=t;for(const m of shaftMats)m.uniforms.t.value=t;dustM.uniforms.t.value=t;dustM.uniforms.hp.value=HP;petalM.uniforms.t.value=t;petalM.uniforms.hp.value=HP;
 for(const h of hazes)h.position.x=h.userData.x+Math.sin(t*.05+h.userData.ph)*1.2;
 const now=performance.now()/1000;
 if(bell.hitT){const e=now-bell.hitT;bell.body.rotation.x=-.035*Math.exp(-e*.5)*Math.sin(e*3.2);if(e>12)bell.hitT=0;}
 if(drum.hitT){const e=now-drum.hitT,k=Math.exp(-e*7)*Math.cos(e*60);drum.head.position.y=.485-.012*k;drum.body.scale.setScalar(1+.006*k);if(e>1)drum.hitT=0;}
 updateCamera(dt,t);finalPass.uniforms.t.value=t;composer.render();}

/* ---------- 启动 ---------- */
try{
 await setLoad('调制丹青…');await buildTextures();buildMaterials();
 await setLoad('立柱架梁…');buildEnv();buildHall();await sleep(0);buildProps();
 const _t0=performance.now();await buildStatue();console.log('statue ms',Math.round(performance.now()-_t0),'tris',statue.children.reduce((a,m)=>a+(m.geometry&&m.geometry.index?m.geometry.index.count/3:0),0));
 await setLoad('燃灯点烛…');buildLights();buildFX();buildPost();resize();bindInput();
 if(qs.get('view')&&VIEWS[qs.get('view')]){cam.view=qs.get('view');const v=VIEWS[cam.view]();cam.p.set(...v.p);cam.l.set(...v.l);cam.f=v.f;}
 renderer.compile(scene,camera);frame();
}catch(e){console.error(e);fail('起殿失败：'+(e&&e.message||e));return;}
$('#load').textContent='殿门已开';const eb=$('#enter');eb.disabled=false;
const enter=()=>{if(st.entered)return;st.entered=true;audioInit();$('#gate').classList.add('gone');document.body.classList.add('in');setView(cam.view);hint('拖动环顾 · 先上香，再敬拜，三拜礼成');toast(`${me.ttl} · ${me.str} 入殿`,4200);play(sBell,.5);};
eb.addEventListener('click',enter);
window.__t={st,cam,setView,enter,ACT,scene,camera,renderer,L,me,fated,statue,tweens};window.__ready=true;
if(qs.has('auto'))enter();
})();
